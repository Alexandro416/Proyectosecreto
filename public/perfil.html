<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - Depor Plaza</title>
    <style>
        :root {
            --sidebar-bg: #e88f13; /* Verde oscuro del diseño */
            --sidebar-hover: #2e7d32;
            --bg-color: #f8f9fa;
            --text-main: #1a1a1a;
            --text-muted: #6c757d;
            --card-bg: #ffffff;
            --success-bg: #e8f5e9;
            --success-text: #2e7d32;
            --danger-bg: #ffebee;
            --danger-text: #c62828;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { display: flex; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: white; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .brand { padding: 30px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;}
        .brand-icon { font-size: 24px; background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; }
        .brand-text h2 { font-size: 16px; margin: 0; letter-spacing: 1px;}
        .brand-text p { font-size: 12px; color: rgba(255,255,255,0.7); }
        
        .nav-menu { flex: 1; padding: 0 15px; }
        .nav-link { display: flex; align-items: center; gap: 15px; padding: 15px 20px; color: white; text-decoration: none; border-radius: 10px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; font-size: 15px;}
        .nav-link:hover { background-color: rgba(255,255,255,0.1); }
        .nav-link.active { background-color: var(--sidebar-hover); }
        
        .user-profile { padding: 20px; background: rgba(0,0,0,0.15); margin: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px; }
        .avatar { width: 40px; height: 40px; background: #4caf50; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px;}
        .user-info h4 { font-size: 14px; margin: 0; }
        .user-info p { font-size: 12px; color: rgba(255,255,255,0.7); margin: 0;}
        
        .logout-btn { margin: 0 15px 20px 15px; padding: 15px; display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.8); cursor: pointer; border-radius: 8px; transition: 0.2s;}
        .logout-btn:hover { background: rgba(255,0,0,0.1); color: white;}

        /* --- MAIN CONTENT --- */
        .main-content { margin-left: 260px; flex: 1; padding: 40px 50px; }
        .header-section { margin-bottom: 30px; }
        .header-section h1 { font-size: 28px; margin-bottom: 5px; }
        .header-section p { color: var(--text-muted); font-size: 15px; }

        /* Filtros */
        .filters { display: flex; gap: 10px; margin-bottom: 30px; }
        .filter-btn { padding: 10px 20px; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: 0.2s;}
        .filter-btn.active { background: var(--sidebar-bg); color: white; border-color: var(--sidebar-bg); }

        /* Tarjetas de Reserva */
        .reservations-list { display: flex; flex-direction: column; gap: 20px; }
        .res-card { background: var(--card-bg); border-radius: 16px; padding: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #f0f0f0; transition: 0.2s;}
        .res-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.06); transform: translateY(-2px);}
        
        .res-info-container { display: flex; gap: 25px; align-items: center; }
        .res-image { width: 90px; height: 90px; border-radius: 12px; background: url('https://images.unsplash.com/photo-1518605368461-1e1e38dd1528?auto=format&fit=crop&q=80&w=200') center/cover; }
        
        .res-details h3 { font-size: 18px; margin-bottom: 5px; display: flex; align-items: center; gap: 15px;}
        .res-id { font-size: 13px; color: var(--text-muted); font-weight: normal; }
        
        .res-meta { display: flex; gap: 20px; margin-top: 15px; font-size: 13px; color: var(--text-muted); }
        .res-meta span { display: flex; align-items: center; gap: 5px; }
        
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.confirmada { background: var(--success-bg); color: var(--success-text); }
        .badge.cancelada { background: var(--danger-bg); color: var(--danger-text); }

        .res-actions { text-align: right; min-width: 150px;}
        .res-price { font-size: 22px; font-weight: 800; margin-bottom: 15px; }
        
        .btn-action { width: 100%; padding: 8px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; transition: 0.2s;}
        .btn-detalle { background: var(--success-bg); color: var(--success-text); }
        .btn-detalle:hover { background: #c8e6c9; }
        .btn-cancelar { background: var(--danger-bg); color: var(--danger-text); }
        .btn-cancelar:hover { background: #ffcdd2; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">🏆</div>
            <div class="brand-text">
                <h2>DEPOR PLAZA</h2>
                <p>Portal de usuario</p>
            </div>
        </div>
        
        <nav class="nav-menu">
<a href="index.html" class="nav-link"><span>🏠</span> Inicio</a>
<a href="sedes.html" class="nav-link"><span>⚽</span> Reservar Cancha</a>
<a href="perfil.html" class="nav-link active"><span>📅</span> Mis Reservas</a>
<a href="#" class="nav-link" onclick="alert('Próximamente')"><span>💳</span> Pagos Pendientes</a>
<a href="datos-perfil.html" class="nav-link"><span>👤</span> Mi Perfil</a>
        </nav>

        <div class="user-profile">
            <div class="avatar" id="user-initials">--</div>
            <div class="user-info">
                <h4 id="user-name">Cargando...</h4>
                <p id="user-email">cargando@email.com</p>
            </div>
        </div>

        <div class="logout-btn" onclick="cerrarSesion()">
            <span>🚪</span> Cerrar sesión
        </div>
    </aside>

    <main class="main-content">
        <div class="header-section">
            <h1>Mis Reservas</h1>
            <p id="contador-reservas">0 reservas activas</p>
        </div>

        <div class="filters">
            <button class="filter-btn active">Todas</button>
            <button class="filter-btn">Confirmadas</button>
            <button class="filter-btn">Completadas</button>
        </div>

        <div class="reservations-list" id="lista-reservas">
            <p>Cargando tus reservas...</p>
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if(!user) window.location.href = 'login.html';

        // Llenar datos del usuario en el sidebar
        document.getElementById('user-name').innerText = user.nombre;
        document.getElementById('user-email').innerText = user.email;
        
        // Generar iniciales (Ej: "Juan Perez" -> "JP")
        const iniciales = user.nombre.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        document.getElementById('user-initials').innerText = iniciales;

        function cerrarSesion() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Formatear Fecha (Ej: "10 Jun 2026")
        function formatearFecha(fechaIso) {
            const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
            const fecha = new Date(fechaIso);
            // Sumamos 1 día porque al leer de MySQL a veces resta horas por la zona horaria
            fecha.setMinutes(fecha.getMinutes() + fecha.getTimezoneOffset()); 
            return `${fecha.getDate()} ${meses[fecha.getMonth()]} ${fecha.getFullYear()}`;
        }

        async function cargarReservas() {
            try {
                const res = await fetch(`/api/mis-reservas/${user.id}`);
                const reservas = await res.json();
                const contenedor = document.getElementById('lista-reservas');
                
                // Actualizar contador
                const activas = reservas.filter(r => r.estado === 'confirmada').length;
                document.getElementById('contador-reservas').innerText = `${activas} reserva(s) activa(s)`;

                if(reservas.length === 0) {
                    contenedor.innerHTML = '<p style="color: #6c757d;">No tienes reservas registradas. ¡Anímate a reservar tu primera cancha!</p>';
                    return;
                }

                contenedor.innerHTML = '';
                
                reservas.forEach(r => {
                    // Calcular hora fin (asumiendo 1 hora de reserva como en tu código anterior)
                    const horaInicioStr = r.hora_inicio.substring(0,5);
                    const horaFinNum = parseInt(horaInicioStr.split(':')[0]) + 1;
                    const horaFinStr = `${horaFinNum}:00`;
                    
                    const fechaFormat = formatearFecha(r.fecha);
                    const isConfirmada = r.estado === 'confirmada';
                    const badgeClass = isConfirmada ? 'confirmada' : 'cancelada';
                    const badgeText = isConfirmada ? 'Confirmada' : 'Cancelada';

                    // Si está cancelada, no mostramos el botón de cancelar
                    const btnCancelarHTML = isConfirmada 
                        ? `<button class="btn-action btn-cancelar" onclick="cancelarReserva(${r.id})">❌ Cancelar</button>` 
                        : '';

                    // Construimos la tarjeta idéntica al diseño
                    contenedor.innerHTML += `
                        <div class="res-card">
                            <div class="res-info-container">
                                <div class="res-image"></div>
                                <div class="res-details">
                                    <h3>${r.nombre} — ${r.tipo || 'Grass Sintético'} <span class="badge ${badgeClass}">${badgeText}</span></h3>
                                    <div class="res-id">#R-00${r.id}</div>
                                    <div class="res-meta">
                                        <span>📅 ${fechaFormat}</span>
                                        <span>🕒 ${horaInicioStr} - ${horaFinStr}</span>
                                        <span>📍 Campo de Marte</span>
                                    </div>
                                </div>
                            </div>
                            <div class="res-actions">
                                <div class="res-price">S/ ${parseFloat(r.precio).toFixed(2)}</div>
                                <button class="btn-action btn-detalle" onclick="alert('Detalles próximamente')">👁️ Detalle</button>
                                ${btnCancelarHTML}
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar:", error);
            }
        }

        async function cancelarReserva(id) {
            if(confirm("¿Estás seguro que deseas cancelar esta reserva?")) {
                try {
                    await fetch(`/api/reservas/${id}/cancelar`, { method: 'POST' });
                    cargarReservas(); // Recargar la lista para que aparezca como Cancelada
                } catch(e) {
                    console.error(e);
                }
            }
        }

        // Cargar al iniciar la vista
        cargarReservas();
    </script>
</body>
</html>
