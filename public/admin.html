<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Depor Plaza</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* Estilos específicos para el Dashboard Admin */
        body { background-color: #f4f6f9; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-header { background-color: #1a1a2e; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h1 { margin: 0; font-size: 20px; color: #f39c12; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .dashboard-container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* Tarjetas de Resumen */
        .summary-cards { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: white; flex: 1; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; }
        .card-icon { width: 50px; height: 50px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .card-info h3 { margin: 0; font-size: 24px; color: #333; }
        .card-info p { margin: 0; font-size: 12px; color: #777; text-transform: uppercase; font-weight: bold; }
        
        /* Tabla Admin */
        .admin-table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th { text-align: left; padding: 12px; border-bottom: 2px solid #eee; color: #555; font-size: 14px; }
        .admin-table td { padding: 15px 12px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; }
        
        /* Badges de Estado */
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-align: center; display: inline-block;}
        .badge.confirmada { background: #d4edda; color: #155724; }
        .badge.pendiente { background: #fff3cd; color: #856404; }
        .badge.cancelada { background: #f8d7da; color: #721c24; }
        
        /* Botones de Acción */
        .action-btn { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; color: white;}
        .btn-approve { background-color: #28a745; }
        .btn-cancel { background-color: #dc3545; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>DeporPlaza - Panel Admin</h1>
        <div>
            <span style="margin-right: 15px;">👤 Administrador</span>
            <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Tarjetas Superiores -->
        <div class="summary-cards">
            <div class="card">
                <div class="card-icon" style="background: #e3f2fd; color: #0d47a1;">📅</div>
                <div class="card-info"><h3 id="tot-reservas">0</h3><p>Total Reservas</p></div>
            </div>
            <div class="card">
                <div class="card-icon" style="background: #fff3cd; color: #f39c12;">⏳</div>
                <div class="card-info"><h3 id="tot-pendientes">0</h3><p>Pendientes (Yape)</p></div>
            </div>
            <div class="card">
                <div class="card-icon" style="background: #d4edda; color: #28a745;">✅</div>
                <div class="card-info"><h3 id="tot-confirmadas">0</h3><p>Confirmadas</p></div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="admin-table-container">
            <h2 style="margin-top:0; font-size: 18px; color:#333;">📋 Gestión de Reservas</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Cancha</th>
                        <th>Fecha y Hora</th>
                        <th>Método</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
