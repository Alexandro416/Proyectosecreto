<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Depor Plaza</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="body-admin">
    <div class="topbar">
        <div class="logo">Panel Admin</div>
        <div>
            <span style="margin-right: 20px;" id="admin-name">Cargando...</span>
            <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="container">
        <h2>Gestión de Reservas</h2>
        
        <div class="card-table">
            <h3>📅 Todas las Reservas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Cliente</th>
                        <th>Cancha</th>
                        <th>Método</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-reservas">
                    </tbody>
            </table>
        </div>
    </div>
<script src="/js/auth.js"></script>
 <script src="/js/admin.js"></script>
</body>
</html>
